<!--
  Talendeur — Reauthentication
  Subject: Your Talendeur verification code
  Paste into: Supabase Dashboard → Authentication → Email → Reauthentication
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification code</title>
</head>
<body style="margin:0;padding:0;background-color:#F7F5F8;font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#F7F5F8;padding:32px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #eee;">
          <tr>
            <td style="background:linear-gradient(90deg,#FFFFFF 0%,#FF9F14 45%,#D1163E 100%);padding:28px 32px;">
              <p style="margin:0;font-size:22px;font-weight:700;color:#180D51;letter-spacing:0.02em;">Talendeur</p>
              <p style="margin:6px 0 0;font-size:13px;color:#ffffff;">Verify it's you</p>
            </td>
          </tr>
          <tr>
            <td style="padding:32px;">
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#180D51;">Your verification code</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#444;">
                Use this code to confirm a sensitive change on your Talendeur account. It expires shortly.
              </p>
              <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:0.2em;color:#180D51;text-align:center;">
                {{ .Token }}
              </p>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#999;">
                If you didn't request this code, secure your account and ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 32px 24px;border-top:1px solid #f0f0f0;background:#FAFAFA;">
              <p style="margin:0;font-size:12px;color:#888;line-height:1.5;">
                Talendeur · Meaningful professional connections<br />
                <a href="{{ .SiteURL }}" style="color:#D1163E;text-decoration:none;">{{ .SiteURL }}</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
