[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  # Enable pre-rendering
  VITE_PRERENDER = "true"

# Cache headers for OG images
[[headers]]
  for = "/storage/v1/object/public/og-images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
